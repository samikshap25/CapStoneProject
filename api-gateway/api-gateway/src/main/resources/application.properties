# ========================
# APPLICATION CONFIG
# ========================
spring.application.name=API-GATEWAY
server.port=8080
spring.main.web-application-type=reactive

# JWT Secret (MUST match User Service exactly!)
jwt.secret=ECOMMERCE_78674867909090909090909

# ========================
# EUREKA CLIENT
# ========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ========================
# GLOBAL CORS CONFIGURATION
# ========================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600


# ========================
# LOGGING
# ========================
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.ecommerce.gateway=DEBUG

# ========================
# ACTUATOR (for monitoring)
# ========================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# REQUIRED for CORS preflight handling
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# REQUIRED to avoid duplicate CORS headers
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials


# NOTE: Routes are defined in GatewayConfig.java (Java-based configuration)