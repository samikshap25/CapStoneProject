spring.application.name=api-gateway
server.port=8080

spring.main.web-application-type=reactive

# JWT Secret (MUST match User Service)
jwt.secret=E_COMMERCE_SECRET_KEY_98765432100000000000000000

# ========================
# EUREKA
# ========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Disable auto discovery routing
spring.cloud.gateway.discovery.locator.enabled=false

# ========================
# GLOBAL CORS
# ========================
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].maxAge=3600

# ========================
# ROUTES (PUBLIC = No JWT, PROTECTED = JWT required)
# ========================

# 🔓 PUBLIC: Auth endpoints (login, signup)
spring.cloud.gateway.routes[0].id=user-service-public
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# 🔓 PUBLIC: View all products (GET only)
spring.cloud.gateway.routes[1].id=product-service-public
spring.cloud.gateway.routes[1].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**
spring.cloud.gateway.routes[1].predicates[1]=Method=GET

# 🔒 PROTECTED: Create/Update/Delete products (requires JWT)
spring.cloud.gateway.routes[2].id=product-service-protected
spring.cloud.gateway.routes[2].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/products/**
spring.cloud.gateway.routes[2].predicates[1]=Method=POST,PUT,DELETE,PATCH

# 🔒 PROTECTED: User management
spring.cloud.gateway.routes[3].id=user-service-protected
spring.cloud.gateway.routes[3].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/users/**

# 🔒 ORDER SERVICE (all protected)
spring.cloud.gateway.routes[4].id=order-service
spring.cloud.gateway.routes[4].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/orders/**,/api/cart/**

# 🔒 INVENTORY SERVICE (protected)
spring.cloud.gateway.routes[5].id=inventory-service
spring.cloud.gateway.routes[5].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/inventory/**

# PAYMENT SERVICE (Node.js)
spring.cloud.gateway.routes[6].id=payment-service
spring.cloud.gateway.routes[6].uri=http://localhost:9000
spring.cloud.gateway.routes[6].predicates[0]=Path=/payment/**